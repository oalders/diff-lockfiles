version: v1.0
name: Tests
agent:
  machine:
    type: e1-standard-2
    os_image: ubuntu2004
blocks:
  - name: Test
    task:
      jobs:
        - name: Test
          commands:
            - checkout
            - sem-version node 22
            - cache restore
            - npm ci
            - cache store
            - npm run build --if-present
            - NODE_OPTIONS=--experimental-vm-modules npm test
